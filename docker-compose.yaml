services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: application
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: FinancialDataDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  python_app:
    build: 
      context: app
      dockerfile: Dockerfile
    container_name: python_app
    restart: always
    depends_on:
      - db
    networks:
      - app-network
    ports:
      - "8000:8000"

    env_file:
      - ./app/.env
    volumes:
      - ./app:/app
    working_dir: /app
    command: python main.py

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    container_name: frontend
    ports:
      - "5173:5173"
    depends_on:
      - python_app

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge